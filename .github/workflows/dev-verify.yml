name: Dev Verify

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dashboard-last-prompt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish tmux zsh
      - name: Install development dependencies
        run: |
          cargo install checkle just --locked
          bash .devcontainer/setup.sh
          echo "$PWD/tests/venv/bin" >> "$GITHUB_PATH"
      - name: Verify
        run: just dev-verify
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: workmux-linux-x86_64
          path: target/release/workmux
          if-no-files-found: error
